<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DangNam — Đăng nhập</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060a10;
      --surface: #0d1420;
      --border: #1a2540;
      --accent: #00c8ff;
      --accent2: #7b2ff7;
      --danger: #ff4757;
      --success: #2ed573;
      --text: #e8f0fe;
      --muted: #5a6a8a;
      --glow: 0 0 30px rgba(0,200,255,0.25);
    }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,200,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,200,255,0.04) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 20s linear infinite;
      pointer-events: none;
    }

    @keyframes gridMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(50px); }
    }

    /* Floating orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      animation: float 8s ease-in-out infinite;
      pointer-events: none;
    }
    .orb-1 { width: 400px; height: 400px; background: var(--accent); top: -10%; left: -10%; animation-delay: 0s; }
    .orb-2 { width: 350px; height: 350px; background: var(--accent2); bottom: -10%; right: -5%; animation-delay: -4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }

    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }

    .brand {
      text-align: center;
      margin-bottom: 40px;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: var(--glow);
    }

    .brand-name {
      font-family: 'Space Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), var(--glow);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .card-desc {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      font-family: 'Sora', sans-serif;
      font-size: 15px;
      color: var(--text);
      transition: all 0.3s ease;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--accent);
      background: rgba(0,200,255,0.05);
      box-shadow: 0 0 0 3px rgba(0,200,255,0.1);
    }

    .form-input::placeholder { color: var(--muted); }

    .btn-login {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 10px;
      font-family: 'Sora', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 8px;
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
    }

    .btn-login::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0);
      transition: background 0.3s;
    }

    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,200,255,0.35); }
    .btn-login:hover::after { background: rgba(255,255,255,0.08); }
    .btn-login:active { transform: translateY(0); }

    .error-msg {
      background: rgba(255,71,87,0.12);
      border: 1px solid rgba(255,71,87,0.3);
      color: var(--danger);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .demo-accounts {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .demo-title {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      text-align: center;
      margin-bottom: 16px;
    }

    .demo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .demo-btn {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .demo-btn:hover { border-color: var(--accent); background: rgba(0,200,255,0.05); }

    .demo-role {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent);
      display: block;
      margin-bottom: 4px;
    }

    .demo-creds {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--muted);
    }

    .pulse-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="login-wrapper">
    <div class="brand">
      <div class="brand-logo">
        <div class="brand-icon">🧠</div>
        <span class="brand-name">PsyTrack</span>
      </div>
      <p class="brand-subtitle">Employee Psychology Analytics</p>
    </div>

    <div class="login-card">
      <div class="card-title">Đăng nhập Hệ thống</div>
      <p class="card-desc">Chỉ dành cho Admin, CEO và Trưởng phòng HR</p>

      {% if error %}
      <div class="error-msg">
        <span>⚠️</span> {{ error }}
      </div>
      {% endif %}

      <form method="POST">
        <div class="form-group">
          <label class="form-label">Tên đăng nhập</label>
          <input type="text" name="username" class="form-input" placeholder="Nhập username..." autocomplete="off" required>
        </div>
        <div class="form-group">
          <label class="form-label">Mật khẩu</label>
          <input type="password" name="password" class="form-input" placeholder="Nhập mật khẩu..." required>
        </div>
        <button type="submit" class="btn-login">🔐 &nbsp; Đăng nhập</button>
      </form>

      <div class="demo-accounts">
        <p class="demo-title">Tài khoản demo</p>
        <div class="demo-grid">
          <div class="demo-btn" onclick="fillLogin('admin','admin123')">
            <span class="demo-role">Admin</span>
            <span class="demo-creds">admin / admin123</span>
          </div>
          <div class="demo-btn" onclick="fillLogin('ceo','ceo123')">
            <span class="demo-role">CEO</span>
            <span class="demo-creds">ceo / ceo123</span>
          </div>
          <div class="demo-btn" onclick="fillLogin('hr','hr123')">
            <span class="demo-role">HR Mgr</span>
            <span class="demo-creds">hr / hr123</span>
          </div>
        </div>
      </div>

      <div class="status-bar">
        <span class="pulse-dot"></span>
        <span>Hệ thống hoạt động bình thường</span>
      </div>
    </div>
  </div>

  <script>
    function fillLogin(user, pass) {
      document.querySelector('input[name="username"]').value = user;
      document.querySelector('input[name="password"]').value = pass;
    }
  </script>
</body>
</html>
