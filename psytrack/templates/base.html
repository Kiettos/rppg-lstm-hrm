<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DangNam — {% block title %}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #060a10;
      --surface: #0d1420;
      --surface2: #111b2e;
      --border: #1a2540;
      --border2: #243050;
      --accent: #00c8ff;
      --accent2: #7b2ff7;
      --accent3: #ff6b35;
      --danger: #ff4757;
      --warning: #ffa502;
      --success: #2ed573;
      --text: #e8f0fe;
      --text2: #8899bb;
      --muted: #4a5a7a;
      --sidebar-w: 240px;
      --header-h: 64px;
    }

    html, body { height: 100%; }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: var(--sidebar-w);
      height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      position: fixed;
      left: 0; top: 0;
      display: flex;
      flex-direction: column;
      z-index: 100;
    }

    .sidebar-brand {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .sidebar-name {
      font-family: 'Space Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sidebar-tagline {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .sidebar-nav {
      flex: 1;
      padding: 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-section-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 12px 8px 6px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-radius: 10px;
      text-decoration: none;
      color: var(--text2);
      font-size: 13.5px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .nav-link:hover {
      background: rgba(255,255,255,0.05);
      color: var(--text);
    }

    .nav-link.active {
      background: rgba(0,200,255,0.1);
      color: var(--accent);
      border: 1px solid rgba(0,200,255,0.15);
    }

    .nav-icon { font-size: 16px; width: 20px; text-align: center; }

    .sidebar-footer {
      padding: 16px;
      border-top: 1px solid var(--border);
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface2);
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .user-avatar {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-role { font-size: 10px; color: var(--muted); }

    .logout-btn {
      display: block;
      margin-top: 10px;
      padding: 8px;
      background: rgba(255,71,87,0.08);
      border: 1px solid rgba(255,71,87,0.2);
      border-radius: 8px;
      color: var(--danger);
      text-align: center;
      text-decoration: none;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .logout-btn:hover { background: rgba(255,71,87,0.15); }

    /* ===== MAIN CONTENT ===== */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: var(--header-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-title {
      font-size: 18px;
      font-weight: 600;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .header-time {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--text2);
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(46,213,115,0.1);
      border: 1px solid rgba(46,213,115,0.2);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 11px;
      color: var(--success);
    }

    .pulse { width: 7px; height: 7px; background: var(--success); border-radius: 50%; animation: pulseAnim 2s infinite; }
    @keyframes pulseAnim { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.7)} }

    .content {
      flex: 1;
      padding: 28px;
      overflow-y: auto;
    }

    /* ===== CARDS ===== */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s;
    }

    .stat-card:hover { border-color: var(--border2); }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
    }

    .stat-card.blue::before { background: linear-gradient(90deg, var(--accent), #0080ff); }
    .stat-card.purple::before { background: linear-gradient(90deg, var(--accent2), #ff6ec7); }
    .stat-card.orange::before { background: linear-gradient(90deg, var(--accent3), #ffcc02); }
    .stat-card.red::before { background: linear-gradient(90deg, var(--danger), #ff6b81); }

    .stat-icon { font-size: 28px; margin-bottom: 12px; display: block; }
    .stat-value { font-family: 'Space Mono', monospace; font-size: 30px; font-weight: 700; line-height: 1; margin-bottom: 4px; }
    .stat-label { font-size: 12px; color: var(--text2); }
    .stat-sub { font-size: 11px; color: var(--muted); margin-top: 8px; }

    /* ===== CHART PANELS ===== */
    .chart-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .chart-grid-3 {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-title { font-size: 14px; font-weight: 600; }
    .panel-sub { font-size: 11px; color: var(--muted); }

    .panel-body { padding: 20px; }

    .chart-wrap { position: relative; width: 100%; }

    /* ===== TABLE ===== */
    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      background: var(--surface2);
      padding: 11px 14px;
      text-align: left;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
    tbody tr:hover { background: rgba(255,255,255,0.025); }
    tbody td { padding: 11px 14px; color: var(--text2); }
    tbody td:first-child { color: var(--text); font-weight: 500; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
    }

    .badge-normal { background: rgba(46,213,115,0.12); color: var(--success); border: 1px solid rgba(46,213,115,0.2); }
    .badge-stressed { background: rgba(255,71,87,0.12); color: var(--danger); border: 1px solid rgba(255,71,87,0.2); }
    .badge-happy { background: rgba(255,214,0,0.12); color: #ffd400; border: 1px solid rgba(255,214,0,0.2); }
    .badge-tired { background: rgba(165,165,255,0.12); color: #a5a5ff; border: 1px solid rgba(165,165,255,0.2); }
    .badge-focused { background: rgba(0,200,255,0.12); color: var(--accent); border: 1px solid rgba(0,200,255,0.2); }

    .alert-badge { background: rgba(255,71,87,0.15); color: var(--danger); border: 1px solid rgba(255,71,87,0.3); padding: 3px 10px; border-radius: 20px; font-size: 11px; }
    .ok-badge { background: rgba(46,213,115,0.12); color: var(--success); padding: 3px 10px; border-radius: 20px; font-size: 11px; }

    /* ===== FILTERS ===== */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding: 16px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .filter-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .filter-select, .filter-input, .filter-date {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-family: 'Sora', sans-serif;
      font-size: 13px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
      cursor: pointer;
    }

    .filter-select:focus, .filter-input:focus, .filter-date:focus {
      border-color: var(--accent);
    }

    .filter-btn {
      padding: 9px 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 8px;
      font-family: 'Sora', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn:hover { opacity: 0.9; transform: translateY(-1px); }

    /* ===== STRESS METER ===== */
    .stress-bar-wrap { display: flex; align-items: center; gap: 10px; }
    .stress-bar { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .stress-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
    .stress-val { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--text2); width: 38px; text-align: right; }

    /* ===== PAGINATION ===== */
    .pagination { display: flex; align-items: center; gap: 8px; justify-content: center; margin-top: 16px; }
    .page-btn { padding: 7px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 7px; color: var(--text2); cursor: pointer; font-size: 13px; transition: all 0.2s; }
    .page-btn:hover, .page-btn.active { background: rgba(0,200,255,0.1); border-color: var(--accent); color: var(--accent); }
    .page-info { font-size: 12px; color: var(--muted); }

    /* ===== LOADING ===== */
    .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 13px; }
    .spinner { display: inline-block; width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 10px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* ===== COLOR UTILS ===== */
    .text-accent { color: var(--accent); }
    .text-danger { color: var(--danger); }
    .text-success { color: var(--success); }
    .text-warning { color: var(--warning); }
    .text-muted { color: var(--muted); }
  </style>
</head>
<body>
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-icon">🧠</div>
      <div>
        <div class="sidebar-name">DangNam</div>
        <div class="sidebar-tagline">DangNam Analytics</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Menu</div>
      <a href="/dashboard" class="nav-link {% if request.path == '/dashboard' %}active{% endif %}">
        <span class="nav-icon">📊</span> Dashboard
      </a>
      <a href="/detail" class="nav-link {% if request.path == '/detail' %}active{% endif %}">
        <span class="nav-icon">🔍</span> Chi tiết & Lọc
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar">👤</div>
        <div class="user-info">
          <div class="user-name">{{ session.name }}</div>
          <div class="user-role">{{ session.role }}</div>
        </div>
      </div>
      <a href="/logout" class="logout-btn">⏻ &nbsp;Đăng xuất</a>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <header class="header">
      <div class="header-title">{% block page_title %}{% endblock %}</div>
      <div class="header-meta">
        <div class="header-time" id="live-time">--:--:--</div>
        <div class="status-pill">
          <span class="pulse"></span> Live
        </div>
      </div>
    </header>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
  </main>

  <script>
    // Live clock
    function updateTime() {
      const now = new Date();
      document.getElementById('live-time').textContent =
        now.toLocaleTimeString('vi-VN', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    }
    updateTime();
    setInterval(updateTime, 1000);

    // Chart.js global defaults
    Chart.defaults.color = '#5a6a8a';
    Chart.defaults.borderColor = '#1a2540';
    Chart.defaults.font.family = "'Sora', sans-serif";
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
